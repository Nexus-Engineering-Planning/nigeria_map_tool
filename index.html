<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nigeria Map Dashboard - PMTiles</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./styles/styles.css">

  <style>
    /* Expand Button (when sidebar collapsed) */
    .expand-button {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      transition: all var(--transition-normal);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .expand-button:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .expand-button.show {
      display: flex;
    }
  </style>
</head>

<body>
  <!-- Loading Spinner -->
  <div id="loading-spinner" class="loading-spinner" style="display: flex;" role="status" aria-live="polite">
    <div class="spinner"></div>
    <span class="sr-only">Loading map...</span>
  </div>

  <!-- Expand Button (shown when sidebar collapsed) -->
  <button id="expand-button" class="expand-button" title="Expand Sidebar" aria-label="Expand Sidebar" aria-expanded="false">&#9776;</button>

  <!-- Sidebar Controls -->
  <div class="sidebar" role="navigation" aria-label="Map Controls">
    <div class="sidebar-header">
      <h3><i class="fa-solid fa-map-marker-alt" aria-hidden="true"></i> Nigeria Map Explorer</h3>
      <button id="sidebar-toggle" class="sidebar-toggle" title="Collapse Sidebar" aria-label="Collapse Sidebar" aria-expanded="true">&#10094;</button>
    </div>

    <!-- Search -->
    <label for="searchInput" class="sr-only">Search for a location</label>
    <input type="text" id="searchInput" placeholder="Search State, LGA, or Ward" aria-label="Search for a location" role="combobox" aria-haspopup="listbox" aria-expanded="false">
    <div id="searchSuggestions" class="search-suggestions" role="listbox" aria-live="polite"></div>

    <!-- State Selection -->
    <label for="state-select">Select State:</label>
    <select id="state-select" aria-label="Select a State">
      <option value="">All States</option>
    </select>

    <!-- Senatorial District Selection -->
    <label for="senatorial-select">Senatorial District:</label>
    <select id="senatorial-select" disabled aria-label="Select a Senatorial District">
      <option value="">Select Senatorial District</option>
    </select>

    <!-- LGA Selection -->
    <label for="lga-select">Select LGA:</label>
    <select id="lga-select" disabled aria-label="Select a Local Government Area">
      <option value="">Select LGA</option>
    </select>

    <!-- Ward Selection -->
    <label for="ward-select">Select Ward:</label>
    <select id="ward-select" disabled aria-label="Select a Ward">
      <option value="">Select Ward</option>
    </select>

    <!-- Feature Summary -->
    <div id="feature-summary"></div>

    <!-- Reset Button -->
    <button id="reset-btn">Reset Filters</button>

    <!-- Layer Toggles -->
    <div class="layer-toggle-section" role="group" aria-labelledby="boundary-layers-heading">
      <h4 id="boundary-layers-heading">Boundary Layers</h4>
      <label><input type="checkbox" id="toggle-states" checked> States</label>
      <label><input type="checkbox" id="toggle-lgas" checked> LGAs</label>
      <label><input type="checkbox" id="toggle-wards" checked> Wards</label>
    </div>

    <div class="layer-toggle-section" role="group" aria-labelledby="additional-layers-heading">
      <h4 id="additional-layers-heading">Additional Layers</h4>
      <label><input type="checkbox" id="toggle-health"> Health Facilities</label>
      <label><input type="checkbox" id="toggle-roads"> Roads</label>
      <label><input type="checkbox" id="toggle-pop"> Population Density</label>
    </div>
  </div>

  <!-- Map Container -->
  <div id="map" role="application"></div>

  <!-- Floating Map Controls -->
  <div class="map-controls">
    <button id="locate-btn" title="My Location" aria-label="Find my location"><i class="fa-solid fa-location-arrow" aria-hidden="true"></i></button>
    <button id="focus-btn" title="Focus Mode" aria-label="Toggle Focus Mode"><i class="fa-solid fa-expand" aria-hidden="true"></i></button>
  </div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- PMTiles Protocol -->
  <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
  <!-- Fuse.js for fuzzy search -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <!-- Main Application -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
