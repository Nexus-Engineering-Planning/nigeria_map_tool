<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nigeria Map Dashboard - PMTiles</title>

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./styles/styles.css">

  <style>
    /* Expand Button (when sidebar collapsed) */
    .expand-button {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      transition: all var(--transition-normal);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .expand-button:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .expand-button.show {
      display: flex;
    }
  </style>
</head>

<body>
  <!-- Loading Spinner -->
  <div id="loading-spinner" class="loading-spinner" style="display: flex;">
    <div class="spinner"></div>
  </div>

  <!-- Expand Button (shown when sidebar collapsed) -->
  <button id="expand-button" class="expand-button" title="Expand Sidebar">&#9776;</button>

  <!-- Sidebar Controls -->
  <div class="sidebar">
    <h3>Nigeria Map Explorer</h3>
    <button id="sidebar-toggle" class="sidebar-toggle" title="Collapse Sidebar">&#10094;</button>

    <!-- Search -->
    <input type="text" id="searchInput" placeholder="Search State, LGA, or Ward">
    <div id="searchSuggestions" class="search-suggestions"></div>

    <!-- State Selection -->
    <label for="state-select">Select State:</label>
    <select id="state-select">
      <option value="">All States</option>
    </select>

    <!-- Senatorial District Selection -->
    <label for="senatorial-select">Senatorial District:</label>
    <select id="senatorial-select" disabled>
      <option value="">Select Senatorial District</option>
    </select>

    <!-- LGA Selection -->
    <label for="lga-select">Select LGA:</label>
    <select id="lga-select" disabled>
      <option value="">Select LGA</option>
    </select>

    <!-- Ward Selection -->
    <label for="ward-select">Select Ward:</label>
    <select id="ward-select" disabled>
      <option value="">Select Ward</option>
    </select>

    <!-- Feature Summary -->
    <div id="feature-summary"></div>

    <!-- Reset Button -->
    <button id="reset-btn">Reset Filters</button>

    <!-- Layer Toggles -->
    <div class="layer-toggle-section">
      <h4>Boundary Layers</h4>
      <label><input type="checkbox" id="toggle-states" checked> States</label>
      <label><input type="checkbox" id="toggle-lgas" checked> LGAs</label>
      <label><input type="checkbox" id="toggle-wards" checked> Wards</label>
    </div>

    <div class="layer-toggle-section">
      <h4>Additional Layers</h4>
      <label><input type="checkbox" id="toggle-health"> Health Facilities</label>
      <label><input type="checkbox" id="toggle-roads"> Roads</label>
      <label><input type="checkbox" id="toggle-pop"> Population Density</label>
    </div>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- PMTiles Protocol -->
  <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
  <!-- Main Application -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
